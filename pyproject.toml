[project]
name = "skillstate"
version = "0.1.0"
description = "Local SKILL.state runtime PoC (arXiv:2608.26263) for Ollama on Framework Desktop."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "PixnBits" }]
keywords = ["skill.state", "agents", "ollama", "long-horizon"]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
]

[project.urls]
Paper = "https://arxiv.org/abs/2608.26263"

[project.scripts]
skillstate = "skillstate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/skillstate"]

[tool.hatch.build.targets.wheel.force-include]
"src/skillstate/skills/warehouse/skill.md" = "skillstate/skills/warehouse/skill.md"
"src/skillstate/skills/repoops/skill.md" = "skillstate/skills/repoops/skill.md"
"src/skillstate/ui/static/index.html" = "skillstate/ui/static/index.html"
